name: Production Deploy Verification

on:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Production Assets
        run: |
          test -f index.html || exit 1
          test -f style.css || exit 1
          test -f script.js || exit 1
          echo "All production files present and verified!"
